name: GitHub Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub profile stats

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test health card generation
        run: node --test tests/health-card.test.cjs

      - name: Generate contribution graph and yearly stats
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: michycipher
          BRANCH_NAME: main
          UTC_OFFSET: 1
          AUTO_PUSH: false
          THEME: radical
          ANIMATION: sequence
          DURATION: 2
          NAME: Michelle Utomi

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub rank card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          path: profile/github-rank.svg
          fail_on_error: true
          options: '{"username":"michycipher","show_icons":true,"include_all_commits":true,"count_private":true,"theme":"radical","hide_border":false,"rank_icon":"default","custom_title":"Michelle Utomi GitHub Stats"}'

      - name: Generate GitHub activity health card
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const login = "michycipher";
            const to = new Date();
            const from = new Date(Date.UTC(to.getUTCFullYear(), 0, 1));
            const query = [
              "query($login: String!, $from: DateTime!, $to: DateTime!) {",
              "  user(login: $login) {",
              "    repositories(privacy: PUBLIC, ownerAffiliations: [OWNER]) { totalCount }",
              "    contributionsCollection(from: $from, to: $to) {",
              "      totalCommitContributions",
              "      totalPullRequestContributions",
              "      totalIssueContributions",
              "      contributionCalendar { totalContributions }",
              "    }",
              "  }",
              "}"
            ].join("\n");
            const data = await github.graphql(query, {
              login,
              from: from.toISOString(),
              to: to.toISOString()
            });
            const contributions = data.user.contributionsCollection;
            const totalContributions = contributions.contributionCalendar.totalContributions;
            const commits = contributions.totalCommitContributions;
            const pullRequests = contributions.totalPullRequestContributions;
            const issues = contributions.totalIssueContributions;
            const repos = data.user.repositories.totalCount;
            for (const value of [totalContributions, commits, pullRequests, issues, repos]) {
              if (!Number.isSafeInteger(value) || value < 0) {
                throw new Error("GitHub returned an invalid activity count; preserving the previous card.");
              }
            }
            const clamp = (value, max) => Math.min(value / max, 1);
            const score = Math.round(100 * (
              clamp(totalContributions, 1500) * 0.50 +
              clamp(commits, 1500) * 0.20 +
              clamp(pullRequests, 250) * 0.20 +
              clamp(repos, 100) * 0.10
            ));
            const grade = score >= 90 ? "A+" : score >= 85 ? "A" : score >= 75 ? "B+" : score >= 65 ? "B" : score >= 55 ? "B-" : score >= 45 ? "C" : score >= 30 ? "D" : "F";
            const esc = (value) => String(value).replace(/[&<>\"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[char]));
            const row = (y, label, value, color) => "<g><circle cx='24' cy='" + y + "' r='5' fill='" + color + "'/><text x='40' y='" + (y + 5) + "' fill='#CBD5E1' font-family='Segoe UI, Ubuntu, sans-serif' font-size='10'>" + esc(label) + "</text><text x='270' y='" + (y + 5) + "' fill='#FFFFFF' font-family='Segoe UI, Ubuntu, sans-serif' font-size='11' font-weight='600' text-anchor='end'>" + esc(value) + "</text></g>";
            const svg = [
              "<svg xmlns='http://www.w3.org/2000/svg' width='560' height='260' viewBox='0 0 560 260' role='img' aria-labelledby='title desc'>",
              "<title id='title'>GitHub activity health grade " + esc(grade) + "</title>",
              "<desc id='desc'>Custom activity grade based on year-to-date GitHub contributions, commits and pull requests, plus the current public repository count.</desc>",
              "<rect x='1' y='1' width='558' height='258' rx='10' fill='#0D1117' stroke='#30363D'/>",
              "<text x='24' y='34' fill='#8B5CF6' font-family='Segoe UI, Ubuntu, sans-serif' font-size='17' font-weight='600'>GitHub Activity Health</text>",
              row(70, "Contributions (current year)", totalContributions, "#22D3EE"),
              row(104, "Commits (current year)", commits, "#8B5CF6"),
              row(138, "Pull requests (current year)", pullRequests, "#F59E0B"),
              row(172, "Issues (current year)", issues, "#F97316"),
              row(206, "Public repositories", repos, "#22C55E"),
              "<circle cx='445' cy='137' r='52' fill='none' stroke='#30233F' stroke-width='8'/>",
              "<circle cx='445' cy='137' r='52' fill='none' stroke='#EC4899' stroke-width='8' stroke-linecap='round' stroke-dasharray='" + (score / 100 * 2 * Math.PI * 52) + " 400' transform='rotate(-90 445 137)'/>",
              "<text x='445' y='144' fill='#FFFFFF' font-family='Segoe UI, Ubuntu, sans-serif' font-size='24' font-weight='700' text-anchor='middle'>" + esc(grade) + "</text>",
              "<text x='445' y='166' fill='#94A3B8' font-family='Segoe UI, Ubuntu, sans-serif' font-size='10' text-anchor='middle'>" + score + "/100</text>",
              "<text x='445' y='218' fill='#94A3B8' font-family='Segoe UI, Ubuntu, sans-serif' font-size='11' text-anchor='middle'>updated by GitHub Actions</text>",
              "<text x='24' y='244' fill='#94A3B8' font-family='Segoe UI, Ubuntu, sans-serif' font-size='10'>Updated " + esc(to.toISOString().slice(0, 16).replace("T", " ")) + " UTC</text>",
              "</svg>"
            ].join("");
            require("fs").writeFileSync("profile/health-grade.svg", svg);

      - name: Generate GitHub streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          path: profile/streak.svg
          options: user=michycipher&theme=dark&hide_border=true&background=0D1117&ring=8B5CF6&fire=EC4899&currStreakLabel=22D3EE&sideLabels=CBD5E1&dates=94A3B8&stroke=30363D&currStreakNum=FFFFFF&sideNums=FFFFFF

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- profile profile-summary-card-output

          if git diff --cached --quiet; then
            echo "Profile stats are already up to date."
            exit 0
          fi
          git commit -m "chore: update GitHub profile stats"
          git pull --rebase origin main
          git push
