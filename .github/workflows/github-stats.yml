name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub profile stats

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph and yearly stats
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: michycipher
          BRANCH_NAME: main
          UTC_OFFSET: 1
          AUTO_PUSH: false
          THEME: radical
          ANIMATION: sequence
          DURATION: 2
          NAME: Michelle Utomi

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate C+ GitHub rank card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          path: profile/github-rank.svg
          fail_on_error: true
          options: '{"username":"michycipher","show_icons":true,"include_all_commits":true,"count_private":true,"theme":"radical","hide_border":false,"rank_icon":"default","custom_title":"Michelle Utomi GitHub Stats"}'

      - name: Generate Most Used Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          path: profile/most-used-languages.svg
          fail_on_error: true
          options: '{"username":"michycipher","layout":"compact","langs_count":8,"theme":"radical","hide_border":false,"custom_title":"Most Used Languages"}'

      - name: Generate GitHub streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          path: profile/streak.svg
          options: user=michycipher&theme=radical&hide_border=false

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile github-profile-summary-card-output profile-summary-card-output || true

          git commit -m "chore: update GitHub profile stats" || exit 0
          git pull --rebase origin main
          git push
